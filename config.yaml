# 基准测试画布 imap 尺寸 越大越清晰
benchmark_nbr_rows: 1200  # 800
benchmark_nbr_cols: 1200  # 1200

# 点云下采样参数（单位：米）
downsampling_leaf_x: .1  # .2  .05
downsampling_leaf_y: .1 # .2  .05
downsampling_leaf_z: .05 # .1  .25

# 海底 SLAM 参数
submap_size: 100  # 每个子地图的 ping 数  原始数据：500
add_gaussian_noise: true  # 是否在模拟数据中添加高斯噪声
noise_seed_dr: 20  # DR边噪声种子（影响图优化约束）
noise_seed_submap: 21  # 子地图噪声种子（影响GICP配准）
# sim_data/250826_sub_maps/NESP_noINS_shortTest：seed 40  20
# 注意：使用两个独立种子以保证在线/离线模式DR噪声一致性

# 高斯噪声标准差（仅 yaw 轴生效；其余轴暂不使用）
submap_level_yaw_std: 0.05   # 第一阶段（匹配前）子地图噪声 yaw 标准差（弧度）
graph_level_yaw_std: 0.005   # 第二阶段（匹配后）图边噪声 yaw 标准差（弧度）

# 子地图重叠放缩系数。参数越小，则对子地图的重叠区域要求越严格。
# 对当前子图 i 和待检查的子图 j，都用 overlap_coverage 计算出它们缩放后的虚拟边界框。
# 调用 checkSubmapsOverlap 函数，判断子图 i 的角点是否完全位于子图 j 的（缩放后）边界框内部。
overlap_coverage: 0.6 # 按此系数减少寻找重叠的子地图区域 原始数据：0.9 
# 250828 NESP 0.6 
# 250828 noNESP 0.5
# 250911 Comb 0.5

# GICP 配准参数（单位：米）
gicp_max_correspondence_distance: 0.1    # 对应点对的最大距离阈值，超过此距离的点对将被忽略 原始数据：20 0.1
gicp_maximum_iterations: 200            # GICP 算法的最大迭代次数 原始数据：200
gicp_transform_epsilon: 1e-3            # 两次迭代间变换矩阵差异的收敛阈值 1e-3
gicp_euclidean_fitness_epsilon: 1e-3    # 配准误差收敛阈值，当误差小于此值时停止迭代 1e-3
gicp_ransac_outlier_rejection_threshold: 0.2  # RANSAC 异常值剔除阈值，用于去除错误匹配 原始数据：1
gicp_normal_use_knn_search: true        # 是否使用 K 近邻搜索计算法向量
gicp_normal_search_radius: 10           # 计算法向量时的搜索半径（当 use_knn_search = false）
gicp_normal_search_k_neighbours: 15     # K 近邻搜索时使用的邻居点数量（当 use_knn_search = true）
gicp_info_diag: [100.0, 100.0, 10.0, 10.0]  # 信息矩阵参数说明 原始数据：[10000.0, 10000.0, 10000.0, 1000.0]
# 定义了 GICP 配准结果的可信度。值越大，表示对该自由度的约束越强，优化时越不容易被改变
# 信息矩阵对角线元素 [x, y, z, rotation]
# - 前三个值(10000.0)控制xyz方向的位置约束强度
# - 最后一个值(1000.0)控制旋转约束的强度
# - 值越大表示约束越强/不确定性越小
# - 值越小表示约束越弱/不确定性越大
# 如果发现位置对齐不准，可以增大前3个值
# 如果发现旋转对齐不准，可以增大最后1个值
# 如果优化结果过于刚性，可以适当减小对应值
# 通常位置约束应大于旋转约束

# DR 权重 - 车辆在子地图间导航的不确定性
# 值越大，表示越不信任里程计，优化时会更倾向于采纳闭环边的修正。
dr_noise_x: 5.  # 5.
dr_noise_y: 5.  # 5.
dr_noise_z: 0.0001      # 0.1
dr_noise_roll: 1e-4
dr_noise_pitch: 1e-4
dr_noise_yaw: 1e-2  # 1e-2

# 回环边协方差计算方法
# 0 = 固定外部值
# 1 = 手动输入（#待办：移至YAML文件）
# 2 = 来自GICP的协方差
# 3 = 从外部文件加载的协方差
lc_edge_covs_type: 2

# 在线增量优化配置
online_opt_enable: true        # 是否启用在线增量优化
online_opt_freq: 1              # 每加入多少个子地图触发一次优化
online_opt_max_iter: 30         # 每次增量优化的最大迭代次数
online_log_path: build          # 在线日志与误差输出目录
online_plot_input: build/ping_error.csv   # 绘图脚本读取的误差CSV路径
online_benchmark_enable: true   # 在线模式下是否生成基准/图像输出
online_opt_snapshot_enable: false           # 是否启用在线优化快照输出
online_opt_snapshot_freq: 1                 # 快照频率，按当前节点数取模
online_opt_snapshot_dir: poses_optimized_online_log  # 快照子目录名称（挂在 online_log_path 下）

# 鲁棒后端设置
enable_huber_loss: false         # 是否使用Huber鲁棒核，默认关闭
